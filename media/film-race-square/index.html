<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #F5F7F3; }
      #root { position: relative; width: 1080px; height: 1080px; background: #F5F7F3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.9" data-width="1080" data-height="1080">
      <div id="sheet-hook" data-composition-id="sheet-hook" data-composition-src="compositions/sheet-hook.html"
        data-start="0" data-duration="2.167" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1080" style="z-index:50"></div>
      <div id="sheet-query" data-composition-id="sheet-query" data-composition-src="compositions/sheet-query.html"
        data-start="1.9" data-duration="7.967" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1080" style="z-index:40"></div>
      <div id="sheet-cube" data-composition-id="sheet-cube" data-composition-src="compositions/sheet-cube.html"
        data-start="9.6" data-duration="3.067" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1080" style="z-index:30"></div>
      <div id="sheet-end" data-composition-id="sheet-end" data-composition-src="compositions/sheet-end.html"
        data-start="12.4" data-duration="2.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1080" style="z-index:20"></div>
      <div id="instrument" data-composition-id="instrument" data-composition-src="compositions/instrument.html"
        data-start="0" data-duration="14.9" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1080" style="z-index:60"></div>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 14.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
