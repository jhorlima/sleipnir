version: 2

sources:
  - name: duckdb_bronze
    description: Raw GHCN-Daily written by the DuckDB ingest (SPEC §7, bronze). Read-only for dbt.
    database: lakehouse
    schema: duckdb_bronze
    tables:
      - name: ghcn_daily_raw
        description: Source columns as loaded (date VARCHAR YYYYMMDD, value INTEGER) plus load metadata; append-only, partitioned by _batch_id (YYYYMM).
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 35, period: day}
          error_after: {count: 70, period: day}
      - name: ghcn_stations_raw
        description: Parsed ghcnd-stations.txt, replaced on every load.
      - name: ghcn_countries_raw
        description: Parsed ghcnd-countries.txt, replaced on every load.
