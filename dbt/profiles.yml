# One output per engine; DBT_TARGET picks it. Schemas come from generate_schema_name.
sleipnir:
  target: "{{ env_var('DBT_TARGET', 'trino') }}"
  outputs:
    trino:
      type: trino
      method: none
      user: dbt
      host: trino
      port: 8080
      http_scheme: http
      database: lakehouse
      schema: trino
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
    # Thrift Server on the Lakekeeper catalog (set as Spark's default catalog), so no database here.
    spark:
      type: spark
      method: thrift
      host: spark
      port: 10000
      schema: spark
      connect_retries: 5
      connect_timeout: 60
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
