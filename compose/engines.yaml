services:
  trino:
    image: trinodb/trino:${TRINO_VERSION:?set in .env}
    profiles: [trino]
    environment:
      S3_REGION: ${S3_REGION:?set in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:?set in .env}
    volumes:
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
      - ./config/trino/catalog:/etc/trino/catalog:ro
    # A real query, not just /v1/info: the node must be registered and scheduling work.
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      start_period: 120s
      start_interval: 3s
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${ENGINE_CPUS:-4}"
          memory: ${ENGINE_MEMORY:-8g}
    # Equal to the memory limit: no swap, so an engine out of memory fails instead of slowing down unseen.
    memswap_limit: ${ENGINE_MEMORY:-8g}
    labels:
      traefik.enable: "true"
      traefik.http.routers.trino.rule: Host(`trino.localhost`)
      traefik.http.routers.trino.entrypoints: web
      traefik.http.services.trino.loadbalancer.server.port: "8080"
    depends_on:
      lakekeeper:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # Spark Thrift Server in one JVM (local[N]); dbt-spark connects with method: thrift.
  # Settings that follow the profile are computed in config/spark/thriftserver.sh.
  spark:
    image: sleipnir-spark:${SPARK_VERSION:-4.1.3-scala2.13-java21-ubuntu}-iceberg${ICEBERG_VERSION:-1.12.0}
    build:
      context: ./config/spark
      args:
        SPARK_VERSION: ${SPARK_VERSION:-4.1.3-scala2.13-java21-ubuntu}
        ICEBERG_VERSION: ${ICEBERG_VERSION:-1.12.0}
    profiles: [spark]
    entrypoint: ["/opt/spark/conf/thriftserver.sh"]
    environment:
      ENGINE_CPUS: ${ENGINE_CPUS:-4}
      ENGINE_MEMORY: ${ENGINE_MEMORY:-8g}
      S3_REGION: ${S3_REGION:?set in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:?set in .env}
    volumes:
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/spark/thriftserver.sh:/opt/spark/conf/thriftserver.sh:ro
    # A real query through the Thrift protocol, as dbt-spark sends it.
    healthcheck:
      test: ["CMD", "/opt/spark/bin/beeline", "-u", "jdbc:hive2://localhost:10000", "-e", "SELECT 1"]
      start_period: 120s
      start_interval: 3s
      interval: 30s
      timeout: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${ENGINE_CPUS:-4}"
          memory: ${ENGINE_MEMORY:-8g}
    # Equal to the memory limit: no swap, so an engine out of memory fails instead of slowing down unseen.
    memswap_limit: ${ENGINE_MEMORY:-8g}
    labels:
      traefik.enable: "true"
      traefik.http.routers.spark.rule: Host(`spark.localhost`)
      traefik.http.routers.spark.entrypoints: web
      traefik.http.services.spark.loadbalancer.server.port: "4040"
    depends_on:
      lakekeeper:
        condition: service_healthy
      rustfs:
        condition: service_healthy
