name: sleipnir

# project_directory keeps relative paths and the root .env shared by every included file.
include:
  - path: compose/storage.yaml
    project_directory: .
  - path: compose/proxy.yaml
    project_directory: .
  - path: compose/engines.yaml
    project_directory: .
  - path: compose/postgres.yaml
    project_directory: .
  - path: compose/ingest.yaml
    project_directory: .
  - path: compose/transform.yaml
    project_directory: .
  - path: compose/serving.yaml
    project_directory: .
  - path: compose/bench.yaml
    project_directory: .
