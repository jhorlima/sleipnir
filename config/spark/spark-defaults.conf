# Static Spark settings. Everything that follows the resource profile or holds a credential
# (master, driver memory, shuffle partitions, S3 keys) is set at container start by
# thriftserver.sh from ENGINE_CPUS / ENGINE_MEMORY / S3_*.

# Iceberg SQL (MERGE, procedures, partition transforms).
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Same warehouse and name as every other engine (SPEC §3.1); unqualified names resolve to it.
spark.sql.defaultCatalog=lakehouse
spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type=rest
spark.sql.catalog.lakehouse.uri=http://lakekeeper:8181/catalog
# Static S3 keys instead of Lakekeeper's credential vending: the I/O path is the same for every engine.
spark.sql.catalog.lakehouse.header.X-Iceberg-Access-Delegation=client-managed
spark.sql.catalog.lakehouse.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.path-style-access=true

# The Thrift Server keeps every closed JDBC session alive, each with its own catalog, and dbt-spark opens one
# session per microbatch. With these caches on, each kept catalog holds a full TableMetadata, so the heap grows with
# commits x sessions until GC thrash (spike V14). Off, every statement reloads the table from the catalog.
spark.sql.catalog.lakehouse.cache-enabled=false
spark.sql.catalog.lakehouse.rest-table-cache.max-entries=0

# Table defaults for every table created through this catalog.
spark.sql.catalog.lakehouse.table-default.format-version=2
spark.sql.catalog.lakehouse.table-default.write.parquet.compression-codec=zstd

# insert_overwrite replaces only the partitions the batch touches (default is the whole table).
spark.sql.sources.partitionOverwriteMode=dynamic

# Adaptive execution: coalesces the many small shuffle partitions and splits skewed ones.
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.skewJoin.enabled=true

spark.sql.iceberg.vectorization.enabled=true
# Faster, smaller shuffle serialization than the Java default.
spark.serializer=org.apache.spark.serializer.KryoSerializer

# Timestamps (maintenance cutoffs, _ingested_at) are read and written in UTC, like the other engines.
spark.sql.session.timeZone=UTC
