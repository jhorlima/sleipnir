connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=${ENV:LAKEKEEPER_WAREHOUSE}
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Trino cannot use Lakekeeper's S3 remote signing and the warehouse has STS off,
# so Trino reads and writes RustFS with its own static keys.
fs.s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.path-style-access=true
s3.region=${ENV:S3_REGION}
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
