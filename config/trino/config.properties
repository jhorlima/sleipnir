coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
# The web UI is served through Traefik, which adds X-Forwarded-* headers; Trino answers 406 without this.
http-server.process-forwarded=true

# Memory limits are left at Trino's defaults on purpose: query.max-memory-per-node and
# memory.heap-headroom-per-node are each 30% of the heap, and the heap is 75% of the
# container limit (jvm.config), so both scale with the S/M/L profile without per-profile values.

# Spill to disk: whole-table window functions and aggregations (a silver --full-refresh, the
# uniqueness tests) exceed the per-query memory of profile M (~1.8 GB) without it.
# The path is inside the container's writable layer; the caps keep it well below the free disk.
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
max-spill-per-node=10GB
query-max-spill-per-node=10GB
spill-compression-codec=LZ4
# ROW_NUMBER() ... = 1 (the silver dedup, SPEC §7.2) is otherwise rewritten into a TopNRanking
# operator, which cannot spill; the plain Window operator can.
optimizer.optimize-top-n-ranking=false
