# Trino: station_years. Everything else comes from base_station_years.
cubes:
  - name: trino_station_years
    extends: base_station_years
    data_source: trino
    # The gold schema (trino_gold) is fixed per engine.
    sql: >
      SELECT station.station_id, years.year
      FROM lakehouse.trino_gold.dim_station AS station
      CROSS JOIN (SELECT DISTINCT year FROM lakehouse.trino_gold.dim_date) AS years
    joins:
      - name: trino_weather_daily
        relationship: one_to_many
        sql: "{CUBE}.station_id = {trino_weather_daily}.station_id AND {CUBE}.year = EXTRACT(YEAR FROM {trino_weather_daily}.date)"
    dimensions:
      - name: annual_prcp
        sql: "{trino_weather_daily.total_prcp}"
        type: number
        sub_query: true
    measures:
      - name: median_station_annual_prcp
        sql: "approx_percentile({annual_prcp}, 0.5)"
        type: number
