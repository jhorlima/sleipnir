# Trino: fct_weather_daily. Everything else comes from base_weather_daily; only what differs is here.
cubes:
  - name: trino_weather_daily
    extends: base_weather_daily
    data_source: trino
    # The gold schema (trino_gold) is fixed per engine.
    sql_table: lakehouse.trino_gold.fct_weather_daily

    # Joins and the country grain reference cubes by name, so they are restated for this engine.
    joins:
      - name: trino_stations
        relationship: many_to_one
        sql: "{CUBE}.station_id = {trino_stations}.station_id"
      - name: trino_dates
        relationship: many_to_one
        sql: "{CUBE}.date = {trino_dates}.date"

    measures:
      # Percentiles: Trino's approx_percentile; not re-aggregated by Cube Store.
      - name: median_tmax
        sql: "approx_percentile({CUBE}.tmax, 0.5)"
        type: number
      - name: p95_tmax
        sql: "approx_percentile({CUBE}.tmax, 0.95)"
        type: number
      - name: p95_prcp
        sql: "approx_percentile({CUBE}.prcp, 0.95)"
        type: number
      - name: total_prcp_country
        multi_stage: true
        sql: "{total_prcp}"
        type: sum
        grain:
          keep_only: [trino_stations.country]
