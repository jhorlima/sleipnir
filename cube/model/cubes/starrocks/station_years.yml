# StarRocks: station_years. Everything else comes from base_station_years.
cubes:
  - name: starrocks_station_years
    extends: base_station_years
    data_source: starrocks
    # Reads the gold tables written by dbt-trino (schema trino_gold).
    sql: >
      SELECT station.station_id, years.year
      FROM lakehouse.trino_gold.dim_station AS station
      CROSS JOIN (SELECT DISTINCT year FROM lakehouse.trino_gold.dim_date) AS years
    joins:
      - name: starrocks_weather_daily
        relationship: one_to_many
        sql: "{CUBE}.station_id = {starrocks_weather_daily}.station_id AND {CUBE}.year = EXTRACT(YEAR FROM {starrocks_weather_daily}.date)"
    dimensions:
      - name: annual_prcp
        sql: "{starrocks_weather_daily.total_prcp}"
        type: number
        sub_query: true
    measures:
      - name: median_station_annual_prcp
        sql: "PERCENTILE_CONT({annual_prcp}, 0.5)"
        type: number
