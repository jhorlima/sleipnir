# dim_station. Engine cubes extend base_stations and set data_source and sql_table (cubes/<engine>/stations.yml).
# base_* cubes are never queried: placeholder data source, not public.
cubes:
  - name: base_stations
    data_source: default
    sql_table: placeholder.dim_station
    public: false

    dimensions:
      - name: station_id
        sql: "{CUBE}.station_id"
        type: string
        primary_key: true
      - name: country
        sql: "{CUBE}.country_code"
        type: string
      - name: elevation
        sql: "{CUBE}.elevation"
        type: number
      - name: latitude
        sql: "{CUBE}.latitude"
        type: number
      - name: longitude
        sql: "{CUBE}.longitude"
        type: number
