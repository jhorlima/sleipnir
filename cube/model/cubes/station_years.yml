# One row per station and year: the outer cube of the nested aggregate (SPEC §8.3).
# annual_prcp is the inner measure (weather_daily.total_prcp) as a sub_query dimension;
# median_station_annual_prcp aggregates it across stations.
cubes:
{%- for data_source in data_sources() %}
{#- Cube references to sibling cubes, e.g. {trino_weather_daily}; Jinja needs the braces spelled out. #}
{%- set weather_daily = ('{' ~ data_source ~ '_weather_daily}') | safe %}
{%- set weather_total_prcp = ('{' ~ data_source ~ '_weather_daily.total_prcp}') | safe %}
  - name: {{ data_source }}_station_years
    data_source: {{ data_source }}
    sql: >
      SELECT station.station_id, years.year
      FROM {{ gold_table(data_source, 'dim_station') }} AS station
      CROSS JOIN (SELECT DISTINCT year FROM {{ gold_table(data_source, 'dim_date') }}) AS years
    public: false

    joins:
      - name: {{ data_source }}_weather_daily
        relationship: one_to_many
        sql: "{CUBE}.station_id = {{ weather_daily }}.station_id AND {CUBE}.year = EXTRACT(YEAR FROM {{ weather_daily }}.date)"

    dimensions:
      - name: id
        sql: "CONCAT({CUBE}.station_id, '|', CAST({CUBE}.year AS VARCHAR))"
        type: string
        primary_key: true
        public: false
      - name: year
        sql: "{CUBE}.year"
        type: number
      - name: annual_prcp
        sql: "{{ weather_total_prcp }}"
        type: number
        sub_query: true

    measures:
      # Stations without precipitation data in the year have a NULL annual_prcp and are skipped.
      - name: median_station_annual_prcp
        sql: "{{ percentile(data_source, '{annual_prcp}', 0.5) }}"
        type: number
{%- endfor %}
