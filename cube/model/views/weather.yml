# The public surface: one view per data source (<data_source>_weather).
views:
{%- for data_source in data_sources() %}
  - name: {{ data_source }}_weather
    public: true
    cubes:
      - join_path: {{ data_source }}_weather_daily
        includes: "*"
        excludes:
          - id
          - total_prcp_all
          - total_prcp_country
          - total_prcp_prior_month
      - join_path: {{ data_source }}_weather_daily.{{ data_source }}_stations
        includes: [country, elevation, latitude, longitude]
      - join_path: {{ data_source }}_weather_daily.{{ data_source }}_dates
        includes: [year, quarter, month]
      - join_path: {{ data_source }}_station_years
        includes:
          - median_station_annual_prcp
          - name: year
            alias: station_year
{%- endfor %}
